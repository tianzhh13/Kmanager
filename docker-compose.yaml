version: '3.8'

services:
  app:
    build: .
    container_name: kafka-management-platform
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    volumes:
      - ./configs/config.yaml:/app/config.yaml:ro
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - kafka-platform

  mysql:
    image: mysql:8.0
    container_name: kafka-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: kafka_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    restart: unless-stopped
    networks:
      - kafka-platform

  # 可选：Redis 用于缓存
  # redis:
  #   image: redis:7-alpine
  #   container_name: kafka-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped
  #   networks:
  #     - kafka-platform

volumes:
  mysql_data:
  # redis_data:

networks:
  kafka-platform:
    driver: bridge